<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Coding Assistant</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <h1>CodePilot</h1>
      <button class="new-chat" type="button">+ New Chat</button>

      <p class="sidebar-label">CHAT HISTORY</p>
      <div class="history-item">Today’s coding session</div>
    </aside>

    <section class="chat-panel">
      <header class="chat-header">
        <div>
          <h2>AI Coding Assistant</h2>
          <p>Local FastAPI application</p>
        </div>
      </header>

      <div id="messages" class="messages">
        <div class="message assistant">
          Hello! Ask me a programming question.
        </div>
      </div>

      <form id="chat-form" class="input-area">
        <div class="composer">
          <textarea
            id="message-input"
            placeholder="Ask anything about programming..."
            rows="2"
            autocomplete="off"
            required
          ></textarea>

          <div class="composer-toolbar">
            <button class="composer-icon" type="button" aria-label="Add attachment">
              +
            </button>

            <span class="composer-label">Local AI assistant</span>

            <select id="language" aria-label="Programming language">
              <option value="Python">Python</option>
              <option value="JavaScript">JavaScript</option>
              <option value="TypeScript">TypeScript</option>
              <option value="Java">Java</option>
              <option value="C">C</option>
              <option value="C++">C++</option>
              <option value="C#">C#</option>
              <option value="Go">Go</option>
              <option value="Rust">Rust</option>
              <option value="PHP">PHP</option>
              <option value="Ruby">Ruby</option>
              <option value="Kotlin">Kotlin</option>
              <option value="Swift">Swift</option>
              <option value="Dart">Dart</option>
              <option value="Scala">Scala</option>
              <option value="R">R</option>
              <option value="MATLAB">MATLAB</option>
              <option value="SQL">SQL</option>
              <option value="HTML and CSS">HTML and CSS</option>
              <option value="Bash">Bash</option>
            </select>

            <button class="send-button" type="submit" aria-label="Send message">
              ↑
            </button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
